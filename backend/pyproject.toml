[project]
name = "formfiller"
version = "0.2.0"
description = "Local-LLM assistant that drafts disability forms (CRA T2201) from clinical notes"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=6.0",
  "cryptography>=43",
  "httpx>=0.28",
  "rapidfuzz>=3.10",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pypdfium2>=4", "pillow>=11"]

[project.scripts]
formfiller = "formfiller.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["formfiller*"]

[tool.setuptools.package-data]
"formfiller.forms.t2201" = ["template.pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
